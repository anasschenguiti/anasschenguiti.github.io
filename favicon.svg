<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Blueprint Navy Background -->
  <rect width="64" height="64" rx="14" fill="#0A1220"/>
  
  <!-- Subtle Blueprint Grid Lines -->
  <line x1="8" y1="20" x2="56" y2="20" stroke="#1E2B47" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="8" y1="44" x2="56" y2="44" stroke="#1E2B47" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="20" y1="8" x2="20" y2="56" stroke="#1E2B47" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="44" y1="8" x2="44" y2="56" stroke="#1E2B47" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Electronic Sheet / Document Outline with Folded Corner -->
  <path d="M 14 8 L 40 8 L 50 18 L 50 56 L 14 56 Z" fill="#111B30" stroke="#FFB020" stroke-width="2" stroke-linejoin="round"/>
  <!-- Folded Corner Flap -->
  <path d="M 40 8 L 40 18 L 50 18" fill="#1E2B47" stroke="#FFB020" stroke-width="2" stroke-linejoin="round"/>

  <!-- Electronic Circuit / PCB Microchip Core -->
  <rect x="25" y="27" width="14" height="14" rx="2" fill="#0A1220" stroke="#FFB020" stroke-width="2"/>
  <rect x="29" y="31" width="6" height="6" fill="#FFB020"/>

  <!-- Circuit Traces & Solder Nodes (Electronic Paths) -->
  <!-- Top trace -->
  <path d="M 32 27 L 32 18 L 24 18" fill="none" stroke="#E6ECF7" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="23" cy="18" r="2" fill="#FFB020"/>

  <!-- Left trace -->
  <path d="M 25 34 L 18 34" fill="none" stroke="#E6ECF7" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="18" cy="34" r="2" fill="#FFB020"/>

  <!-- Right trace -->
  <path d="M 39 34 L 46 34 L 46 42" fill="none" stroke="#E6ECF7" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="46" cy="43" r="2" fill="#FFB020"/>

  <!-- Bottom trace -->
  <path d="M 32 41 L 32 49 L 24 49" fill="none" stroke="#E6ECF7" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="23" cy="49" r="2" fill="#FFB020"/>
  
  <!-- Technical CAD Crosshair Marker at bottom right -->
  <path d="M 54 58 L 60 58 M 57 55 L 57 61" stroke="#FFB020" stroke-width="1.5"/>
</svg>